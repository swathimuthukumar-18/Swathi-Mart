<title>Swathi Mart - Cart</title>

<style>

    body {
        margin: 0;
        font-family: Arial, sans-serif;

```
<header>
    <h1>🛒 Swathi Mart - Cart</h1>
</header>

<nav>
    <a href="home.html">Home</a>
    <a href="home.html#products">Products</a>
    <a href="cart.html">🛒 Cart</a>
</nav>

<div class="container">

    <div class="cart-box">

        <h2>Your Shopping Cart</h2>

        <div id="cartItems"></div>

        <div class="total-box">
            <h3 id="total"></h3>

            <button id="checkoutButton" onclick="checkout()">
                Proceed to Checkout →
            </button>
        </div>

    </div>

</div>

<footer>
    <p>© 2026 Swathi Mart | Online Shopping</p>
</footer>


<script>

    function displayCart() {

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        let cartItems = document.getElementById("cartItems");
        let totalElement = document.getElementById("total");
        let checkoutButton = document.getElementById("checkoutButton");

        cartItems.innerHTML = "";

        let total = 0;

        if (cart.length === 0) {

            cartItems.innerHTML =
                '<div class="empty-cart">' +
                '<h3>🛒 Your cart is empty</h3>' +
                '<p>Add some products to your cart and start shopping!</p>' +
                '</div>';

            totalElement.innerHTML = "";

            checkoutButton.style.display = "none";

            return;
        }

        checkoutButton.style.display = "inline-block";

        cart.forEach(function(item, index) {

            let icon = "🛍️";

            if (item.name === "Product 1") {
                icon = "💻";
            }

            if (item.name === "Product 2") {
                icon = "📱";
            }

            if (item.name === "Product 3") {
                icon = "🎧";
            }

            cartItems.innerHTML +=
                '<div class="cart-item">' +

                '<div class="item-info">' +

                '<div class="item-icon">' +
                icon +
                '</div>' +

                '<div>' +
                '<div class="item-name">' +
                item.name +
                '</div>' +

                '<div class="item-price">₹' +
                item.price +
                '</div>' +

                '</div>' +

                '</div>' +

                '<button class="remove-button" ' +
                'onclick="removeFromCart(' + index + ')">' +
                'Remove' +
                '</button>' +

                '</div>';

            total += Number(item.price);

        });

        totalElement.innerHTML = "Total: ₹" + total;

    }


    function removeFromCart(index) {

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        cart.splice(index, 1);

        localStorage.setItem("cart", JSON.stringify(cart));

        displayCart();

    }


    function checkout() {

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        if (cart.length === 0) {

            alert("Your cart is empty!");

            return;
        }

        window.location.href = "checkout.html";

    }


    displayCart();

</script>
